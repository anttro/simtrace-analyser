[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "simtrace-analyser"
version = "2.0.0"
description = "SIMtrace Analyser — APDU trace analyser for GSMTAP/PCAP captures (bundles the simtrace2-pysniff utility)"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "GPL-2.0-or-later"}
requires-python = ">=3.9"
dependencies = [
    "pyusb>=1.2",
]

[project.scripts]
simtrace-analyser-server = "simtrace_analyser.__main__:main"
simtrace2-pysniff = "simtrace2_pysniff.__main__:main"

[tool.setuptools.packages.find]
include = ["simtrace_analyser*", "simtrace2_pysniff*"]
