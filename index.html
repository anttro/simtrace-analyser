<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIMtrace Analyser</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font: 14px/1.5 system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* Tabs */
.tabs { display: flex; background: #16213e; border-bottom: 2px solid #0f3460; }
.tab { padding: 12px 24px; cursor: pointer; color: #888; border-bottom: 2px solid transparent; margin-bottom: -2px; }
.tab:hover { color: #ccc; }
.tab.active { color: #e94560; border-bottom-color: #e94560; }

/* Panels */
.panel { flex: 1; display: none; flex-direction: column; overflow: hidden; }
.panel.active { display: flex; }

/* Trace view */
.trace-topbar { display: flex; gap: 12px; padding: 12px 16px; background: #16213e; align-items: center; flex-shrink: 0; }
.trace-topbar input { flex: 1; padding: 8px 12px; background: #0f3460; border: 1px solid #1a1a4e; border-radius: 4px; color: #e0e0e0; }
.trace-topbar select { padding: 8px 12px; background: #0f3460; border: 1px solid #1a1a4e; border-radius: 4px; color: #e0e0e0; }
.trace-topbar button { padding: 8px 16px; background: #e94560; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
.trace-topbar button:hover { background: #c73652; }
.trace-topbar button.stop { background: #0f3460; }
.trace-topbar button.stop:hover { background: #16213e; }
.trace-topbar button.connect { background: #f9ed69; color: #1a1a2e; }
.trace-topbar button.connect:hover { background: #e0d050; }
.trace-main { display: flex; flex: 1; overflow: hidden; }

/* APDU list */
.apdu-list { flex: 1; overflow-y: auto; padding: 8px; }
.apdu-entry { display: flex; gap: 12px; padding: 6px 12px; border-bottom: 1px solid #16213e; cursor: pointer; align-items: baseline; }
.apdu-entry:hover { background: #16213e; }
.apdu-entry.selected { background: #0f3460; }
.apdu-time { color: #888; font-family: monospace; white-space: nowrap; min-width: 80px; }
.apdu-type { color: #fff; font-weight: 600; min-width: 150px; }
.apdu-type.atr { color: #4ecca3; }
.apdu-type.pps { color: #f9ed69; }
.apdu-data { font-family: monospace; color: #aaa; word-break: break-all; flex: 1; }

/* Side panel */
.side-panel { width: 260px; background: #16213e; padding: 12px; overflow-y: auto; flex-shrink: 0; border-left: 1px solid #0f3460; }
.side-panel h3 { color: #e94560; margin-bottom: 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
.side-item { display: flex; justify-content: space-between; padding: 6px 8px; cursor: pointer; border-radius: 4px; font-size: 13px; }
.side-item:hover { background: #0f3460; }
.side-item .count { color: #e94560; font-weight: 600; }

/* Status bar */
.status-bar { display: flex; padding: 8px 16px; background: #16213e; border-top: 1px solid #0f3460; font-size: 13px; gap: 16px; flex-shrink: 0; }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.status-dot.live { background: #4ecca3; }
.status-dot.paused { background: #f9ed69; }
.status-dot.off { background: #888; }

/* Sessions */
.sessions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; padding: 16px; overflow-y: auto; }
.session-card { background: #16213e; border-radius: 8px; padding: 16px; cursor: pointer; border: 1px solid #0f3460; }
.session-card:hover { border-color: #e94560; }
.session-name { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.session-name input { flex: 1; padding: 4px 8px; background: #0f3460; border: 1px solid #1a1a4e; color: #e0e0e0; border-radius: 4px; font-size: 14px; }
.session-name input:focus { border-color: #e94560; outline: none; }
.session-name .edit-hint { color: #888; font-size: 12px; }
.session-meta { display: flex; gap: 16px; color: #888; font-size: 12px; }
.session-meta span { display: flex; align-items: center; gap: 4px; }
.session-delete { margin-top: 12px; padding: 4px 12px; background: none; border: 1px solid #e94560; color: #e94560; border-radius: 4px; cursor: pointer; }
.session-delete:hover { background: #e94560; color: #fff; }

/* Settings */
.settings-view { padding: 24px; max-width: 500px; }
.settings-view label { display: block; margin-bottom: 6px; color: #888; }
.settings-view input { width: 100%; padding: 8px 12px; background: #0f3460; border: 1px solid #1a1a4e; color: #e0e0e0; border-radius: 4px; margin-bottom: 16px; }
.settings-view .conn-status { padding: 12px; border-radius: 4px; margin-bottom: 12px; }
.settings-view .conn-status.connected { background: #1a3a1a; color: #4ecca3; }
.settings-view .conn-status.disconnected { background: #3a1a1a; color: #e94560; }

/* Empty state */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #888; gap: 16px; }
.empty-state button { padding: 12px 24px; background: #e94560; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: #16213e; border-radius: 8px; padding: 24px; max-width: 400px; width: 90%; }
.modal h3 { margin-bottom: 12px; color: #e94560; }
.modal p { color: #ccc; margin-bottom: 16px; }
.modal-buttons { display: flex; gap: 8px; justify-content: flex-end; }
.modal-buttons button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
.modal-buttons .confirm { background: #e94560; color: #fff; }
.modal-buttons .cancel { background: #0f3460; color: #ccc; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #1a1a2e; }
::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }
</style>
</head>
<body>

<div class="tabs">
    <div class="tab active" data-tab="trace">Trace</div>
    <div class="tab" data-tab="sessions">Sessions</div>
    <div class="tab" data-tab="settings">Settings</div>
</div>

<!-- Trace Panel -->
<div class="panel active" id="panel-trace">
    <div class="trace-topbar">
        <input type="text" id="search-input" placeholder="Search hex bytes..." autocomplete="off">
        <select id="filter-select">
            <option value="">All types</option>
            <option value="tpdu">TPDU</option>
            <option value="atr">ATR</option>
            <option value="pps">PPS</option>
            <option value="change">Change</option>
            <option value="fidi">FiDi</option>
        </select>
        <button id="capture-btn">Start Capture</button>
        <span id="session-name-display" style="display:none; color:#888; font-size:13px;"></span>
    </div>
    <div class="trace-main">
        <div class="apdu-list" id="apdu-list"></div>
        <div class="side-panel" id="side-panel">
            <h3>Command Types</h3>
            <div id="type-counts">—</div>
            <h3 style="margin-top:16px;">Flags</h3>
            <div id="flag-info" style="font-size:12px; color:#888;">—</div>
        </div>
    </div>
    <div class="status-bar">
        <span><span class="status-dot off" id="status-dot"></span><span id="status-text">Not connected</span></span>
        <span id="msg-count" style="color:#888;">0 messages</span>
    </div>
</div>

<!-- Sessions Panel -->
<div class="panel" id="panel-sessions">
    <div class="sessions-grid" id="sessions-grid">
        <div class="empty-state" style="height:auto; padding:40px;">
            <p>No saved sessions</p>
            <p style="font-size:12px;">Start a capture from the Trace tab to create sessions.</p>
        </div>
    </div>
</div>

<!-- Settings Panel -->
<div class="panel" id="panel-settings">
    <div class="settings-view">
        <label for="server-url">Server URL</label>
        <input type="text" id="server-url" value="http://127.0.0.1:8081" placeholder="http://127.0.0.1:8081">
        <div class="conn-status disconnected" id="conn-status">
            ⬤ Not connected — ensure the server is running on the URL above
        </div>
    </div>
</div>

<!-- Delete confirmation modal -->
<div class="modal-overlay" id="delete-modal">
    <div class="modal">
        <h3>Delete Session</h3>
        <p>Delete <strong id="delete-session-name"></strong> and all its APDU data? This cannot be undone.</p>
        <div class="modal-buttons">
            <button class="cancel" id="delete-cancel">Cancel</button>
            <button class="confirm" id="delete-confirm">Delete</button>
        </div>
    </div>
</div>

<script>
// ──────────────────── State ────────────────────
const STATE = {
    serverUrl: localStorage.getItem('serverUrl') || 'http://127.0.0.1:8081',
    activeTab: 'trace',
    captureActive: false,
    currentSessionId: null,
    currentSessionName: null,
    sessionViewId: null,
    livePoller: null,
    messages: [],
    typeCounts: [],
    pendingDeleteId: null,
    serverAvailable: false,
};

const API_BASE = () => STATE.serverUrl;

const INS_NAMES = {
    'a4': 'SELECT', 'a0': 'SELECT', '70': 'MANAGE CHANNEL',
    'b0': 'READ BINARY', 'b1': 'READ RECORD',
    'd6': 'UPDATE BINARY', 'dc': 'UPDATE RECORD',
    'c0': 'GET RESPONSE', 'c2': 'ENVELOPE',
    '20': 'VERIFY', '21': 'VERIFY',
    '88': 'AUTHENTICATE', '89': 'AUTHENTICATE',
    '82': 'EXTERNAL AUTHENTICATE',
    '84': 'GET CHALLENGE',
    'f2': 'STATUS',
    '14': 'TERMINAL RESPONSE',
    '12': 'FETCH',
    'e2': 'APPEND RECORD',
    '32': 'INCREASE',
    '04': 'DEACTIVATE FILE',
    '44': 'ACTIVATE FILE',
};

function ins_name(hex) {
    if (!hex) return '?';
    const b = hex.slice(0, 2).toLowerCase();
    return INS_NAMES[b] || '0x' + b.toUpperCase();
}

function ins_label(msg) {
    if (msg.type === 'atr') return 'ATR';
    if (msg.type === 'pps') return 'PPS';
    if (msg.type === 'change') return 'CHANGE';
    if (msg.type === 'fidi') return 'FIDI';
    const d = msg.data;
    if (d.length >= 10) {
        const ins = d.slice(2, 4);
        return ins_name(ins);
    }
    return 'TPDU';
}

function fmt_elapsed(e) {
    const s = Math.floor(e);
    const ms = Math.round((e - s) * 1000);
    return `${String(s).padStart(4, '0')}.${String(ms).padStart(3, '0')}`;
}

function fmt_data(hex, limit) {
    limit = limit || 32;
    const pairs = hex.match(/.{1,2}/g) || [];
    const shown = pairs.slice(0, limit);
    let s = shown.join(' ');
    if (pairs.length > limit) s += ' ...';
    return s;
}

// ──────────────────── API ────────────────────
const API = {
    async _fetch(method, path, body) {
        const opts = { method, headers: {} };
        if (body) {
            opts.headers['Content-Type'] = 'application/json';
            opts.body = JSON.stringify(body);
        }
        const res = await fetch(API_BASE() + path, opts);
        return res.json();
    },
    status()        { return this._fetch('GET', '/api/status'); },
    listSessions()  { return this._fetch('GET', '/api/sessions'); },
    getSession(id, offset)  { return this._fetch('GET', `/api/sessions/${id}?offset=${offset || 0}&limit=500`); },
    renameSession(id, name) { return this._fetch('PATCH', `/api/sessions/${id}`, { name }); },
    deleteSession(id)       { return this._fetch('DELETE', `/api/sessions/${id}`); },
    startCapture()          { return this._fetch('POST', '/api/capture/start'); },
    stopCapture()           { return this._fetch('POST', '/api/capture/stop'); },
    getLatest(after)        { return this._fetch('GET', `/api/capture/latest?after=${after}`); },
    searchMessages(sessionId, query) { return this._fetch('GET', `/api/apdu/search?session_id=${sessionId}&q=${encodeURIComponent(query)}`); },
    filterMessages(sessionId, type) { return this._fetch('GET', `/api/apdu/filter?session_id=${sessionId}&type=${type}`); },
};

// ──────────────────── UI Helpers ────────────────────
function el(id) { return document.getElementById(id); }
function $on(id, ev, fn) { el(id).addEventListener(ev, fn); }

function buildTypeCounts() {
    const counts = {};
    for (const m of STATE.messages) {
        const lbl = ins_label(m);
        counts[lbl] = (counts[lbl] || 0) + 1;
    }
    STATE.typeCounts = counts;
}

function renderSidePanel() {
    const entries = Object.entries(STATE.typeCounts).sort((a, b) => b[1] - a[1]);
    el('type-counts').innerHTML = entries.map(([k, v], i) =>
        `<div class="side-item" data-idx="${i}" data-key="${k}">
            <span>${k}</span><span class="count">${v}</span>
        </div>`
    ).join('') || 'No commands';
}

function scrollToType(typeKey) {
    const apduList = el('apdu-list');
    let targetEl = null;
    for (const el of apduList.querySelectorAll('.apdu-entry')) {
        const msgIdx = parseInt(el.dataset.idx);
        const msg = STATE.messages[msgIdx];
        if (msg && ins_label(msg) === typeKey) {
            targetEl = el;
            break;
        }
    }
    if (targetEl) {
        targetEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
        targetEl.classList.add('selected');
        setTimeout(() => targetEl.classList.remove('selected'), 1500);
    }
}

// ──────────────────── Render Trace ────────────────────
function renderMessages() {
    const list = el('apdu-list');
    const searchQ = el('search-input').value.toLowerCase();
    const filterType = el('filter-select').value;

    const filtered = STATE.messages.filter(m => {
        if (filterType && m.type !== filterType) return false;
        if (searchQ) return m.data.toLowerCase().includes(searchQ);
        return true;
    });

    buildTypeCounts();
    renderSidePanel();

    if (!STATE.captureActive && !STATE.sessionViewId) {
        list.innerHTML = `<div class="empty-state"><p>No capture active</p>
            <button id="trace-start-btn">Start Capture</button></div>`;
        $('#trace-start-btn', list).addEventListener('click', startCapture);
        updateStatus();
        return;
    }

    list.innerHTML = filtered.map((m, i) => {
        const label = ins_label(m);
        const typeCls = m.type === 'atr' ? 'atr' : m.type === 'pps' ? 'pps' : '';
        return `<div class="apdu-entry" data-idx="${i}">
            <span class="apdu-time">${fmt_elapsed(m.elapsed)}</span>
            <span class="apdu-type ${typeCls}">${label}</span>
            <span class="apdu-data">${fmt_data(m.data)}</span>
        </div>`;
    }).join('');

    list.scrollTop = list.scrollHeight;
    updateStatus();
}

function $(selector, root) { return (root || document).querySelector(selector); }

function updateStatus() {
    const dot = el('status-dot');
    const text = el('status-text');
    const count = el('msg-count');

    dot.className = 'status-dot';
    if (STATE.captureActive) {
        dot.classList.add('live');
        text.textContent = 'Live';
    } else if (STATE.sessionViewId || STATE.currentSessionId) {
        dot.classList.add('paused');
        text.textContent = STATE.currentSessionName || 'Session';
    } else {
        dot.classList.add('off');
        text.textContent = 'Not connected';
    }
    count.textContent = STATE.messages.length + ' messages';
}

// ──────────────────── Live Polling ────────────────────
let _lastAfter = 0;

function startPolling() {
    _lastAfter = 0;
    if (STATE.livePoller) return;
    STATE.livePoller = setInterval(async () => {
        try {
            const data = await API.getLatest(_lastAfter);
            if (data.active) {
                STATE.captureActive = true;
                STATE.currentSessionId = data.session_id;
            }
            if (data.messages && data.messages.length > 0) {
                STATE.messages.push(...data.messages);
                _lastAfter = data.next_after;
                renderMessages();
            }
            if (!data.active && STATE.captureActive) {
                STATE.captureActive = false;
                renderMessages();
            }
        } catch (e) {}
    }, 500);
}

function stopPolling() {
    if (STATE.livePoller) {
        clearInterval(STATE.livePoller);
        STATE.livePoller = null;
    }
}

// ──────────────────── Capture ────────────────────
async function startCapture() {
    try {
        const data = await API.startCapture();
        STATE.captureActive = true;
        STATE.currentSessionId = data.session_id;
        STATE.messages = [];
        buildTypeCounts();
        renderSidePanel();
        renderMessages();
        updateCaptureButton();
        startPolling();
    } catch (e) {
        alert('Failed to start capture: ' + e.message);
    }
}

async function stopCapture() {
    try {
        await API.stopCapture();
        STATE.captureActive = false;
        STATE.sessionViewId = null;
        updateCaptureButton();
        updateStatus();
    } catch (e) {}
}

function updateCaptureButton() {
    const btn = el('capture-btn');
    btn.classList.remove('stop', 'connect');
    if (!STATE.serverAvailable) {
        btn.textContent = 'Connect to server';
        btn.classList.add('connect');
    } else if (STATE.captureActive) {
        btn.textContent = 'Stop Capture';
        btn.classList.add('stop');
    } else {
        btn.textContent = 'Start Capture';
    }
}

// ──────────────────── Sessions ────────────────────
async function loadSessions() {
    try {
        const data = await API.listSessions();
        const grid = el('sessions-grid');
        if (!data.sessions.length) {
            grid.innerHTML = `<div class="empty-state" style="height:auto; padding:40px;">
                <p>No saved sessions</p>
            </div>`;
            return;
        }
        grid.innerHTML = data.sessions.map(s => {
            const name = s.name || `Session #${s.id}`;
            const dStart = s.started ? s.started.replace('T', ' ') : '?';
            const duration = s.ended ? formatDuration(s.started, s.ended) : 'active';
            return `<div class="session-card" data-id="${s.id}">
                <div class="session-name">
                    <input type="text" value="${escapeHtml(name)}" data-sid="${s.id}" placeholder="Session name...">
                </div>
                <div class="session-meta">
                    <span>${dStart}</span>
                    <span>${duration}</span>
                    <span>${s.message_count} msgs</span>
                    <span>${s.mode}</span>
                </div>
                <button class="session-delete" data-sid="${s.id}">Delete</button>
            </div>`;
        }).join('');

        grid.querySelectorAll('.session-card').forEach(card => {
            card.addEventListener('click', e => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
                loadSession(parseInt(card.dataset.id));
            });
        });
        grid.querySelectorAll('.session-name input').forEach(input => {
            input.addEventListener('blur', async () => {
                const sid = parseInt(input.dataset.sid);
                const name = input.value.trim();
                await API.renameSession(sid, name);
            });
            input.addEventListener('keydown', e => {
                if (e.key === 'Enter') input.blur();
            });
        });
        grid.querySelectorAll('.session-delete').forEach(btn => {
            btn.addEventListener('click', e => {
                e.stopPropagation();
                const sid = parseInt(btn.dataset.sid);
                showDeleteModal(sid);
            });
        });
    } catch (e) {}
}

async function loadSession(id) {
    try {
        const data = await API.getSession(id, 0);
        STATE.sessionViewId = id;
        STATE.captureActive = false;
        STATE.currentSessionName = data.session.name || `Session #${id}`;
        STATE.messages = data.messages;
        stopPolling();
        switchTab('trace');
        updateCaptureButton();
        renderMessages();
        el('session-name-display').style.display = 'inline';
        el('session-name-display').textContent = data.session.name || '';
        el('capture-btn').textContent = data.session.name ? 'Edit Name' : 'Rename';
    } catch (e) {
        alert('Failed to load session');
    }
}

function formatDuration(start, end) {
    if (!start || !end) return '?';
    const ms = new Date(end) - new Date(start);
    const s = Math.floor(ms / 1000);
    if (s < 60) return s + 's';
    const m = Math.floor(s / 60);
    return m + 'm ' + (s % 60) + 's';
}

function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function showDeleteModal(id) {
    STATE.pendingDeleteId = id;
    const s = document.querySelector(`.session-card[data-id="${id}"] input`);
    el('delete-session-name').textContent = s ? s.value : `Session #${id}`;
    el('delete-modal').classList.add('show');
}

async function confirmDelete() {
    const id = STATE.pendingDeleteId;
    if (!id) return;
    try {
        await API.deleteSession(id);
        el('delete-modal').classList.remove('show');
        STATE.pendingDeleteId = null;
        loadSessions();
    } catch (e) {
        alert('Failed to delete session');
    }
}

// ──────────────────── Settings ────────────────────
async function checkConnection() {
    try {
        const data = await API.status();
        STATE.serverAvailable = true;
        const elStatus = el('conn-status');
        elStatus.textContent = '⬤ Connected — ' + data.server;
        elStatus.className = 'conn-status connected';
        el('status-dot').className = 'status-dot ' + (data.capture_active ? 'live' : 'paused');
        el('status-text').textContent = data.capture_active ? 'Capturing' : 'Connected';
        if (data.capture_active) {
            STATE.captureActive = true;
            STATE.currentSessionId = data.session_id;
            updateCaptureButton();
        }
    } catch (e) {
        STATE.serverAvailable = false;
        const elStatus = el('conn-status');
        elStatus.textContent = '⬤ Not connected — ensure the server is running on the URL above';
        elStatus.className = 'conn-status disconnected';
        el('status-dot').className = 'status-dot off';
        el('status-text').textContent = 'Not connected';
        updateCaptureButton();
    }
}

// ──────────────────── Tabs ────────────────────
function switchTab(name) {
    STATE.activeTab = name;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
    if (name === 'sessions') loadSessions();
    if (name === 'settings') checkConnection();
}

// ──────────────────── Search / Filter ────────────────────
let _searchTimer = null;
function onSearchChange() {
    clearTimeout(_searchTimer);
    _searchTimer = setTimeout(renderMessages, 200);
}

function onFilterChange() {
    renderMessages();
}

// ──────────────────── Init ────────────────────
function init() {
    el('server-url').value = STATE.serverUrl;

    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => switchTab(tab.dataset.tab));
    });

    $on('capture-btn', 'click', () => {
        if (!STATE.serverAvailable) {
            switchTab('settings');
            return;
        }
        if (STATE.captureActive) return stopCapture();
        if (STATE.sessionViewId) {
            el('session-name-display').style.display = 'none';
            STATE.sessionViewId = null;
            STATE.currentSessionName = null;
            updateCaptureButton();
        }
        startCapture();
    });

    $on('search-input', 'input', onSearchChange);
    $on('filter-select', 'change', onFilterChange);

    $on('server-url', 'change', () => {
        STATE.serverUrl = el('server-url').value.trim();
        localStorage.setItem('serverUrl', STATE.serverUrl);
        checkConnection();
    });

    $on('delete-cancel', 'click', () => {
        el('delete-modal').classList.remove('show');
        STATE.pendingDeleteId = null;
    });
    $on('delete-confirm', 'click', confirmDelete);

    el('side-panel').addEventListener('click', e => {
        const item = e.target.closest('.side-item');
        if (!item) return;
        scrollToType(item.dataset.key);
    });

    checkConnection();
    setInterval(checkConnection, 5000);

    el('apdu-list').addEventListener('click', e => {
        const entry = e.target.closest('.apdu-entry');
        if (!entry) return;
        const idx = parseInt(entry.dataset.idx);
        const msg = STATE.messages[idx];
        if (!msg) return;
        el('flag-info').textContent = `Elapsed: ${fmt_elapsed(msg.elapsed)}
Type: ${msg.type}
Length: ${msg.data.length / 2} bytes`;
    });

    updateCaptureButton();
}

init();
</script>
</body>
</html>
